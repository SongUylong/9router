name: Workplace package
run-name: 9router-${{ inputs.request_id }}

on:
  push:
    branches: [fix/iframe-dashboard-auth]
    paths: [.github/workflows/workplace-package.yml]
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID generated by the Workplace update broker
        required: true
        type: string
      source_commit:
        description: Optional exact maintained branch SHA (40 lowercase hex characters)
        required: false
        type: string

# Package only: no branch writes, publishing, SSH, or production deployment.
permissions:
  contents: read

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: printf '%s\n' 'Register manual packaging workflow; no build or deployment.'
  package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Reject other repositories, branches, and malformed inputs
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'SongUylong/9router' ]]
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$GITHUB_REF" == 'refs/heads/fix/iframe-dashboard-auth' ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          [[ -z "$SOURCE_COMMIT" || "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$SOURCE_COMMIT" || "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]

      - name: Check out immutable dispatch SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SongUylong/9router
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate checkout against maintained branch
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          branch_sha="$(git ls-remote --exit-code origin refs/heads/fix/iframe-dashboard-auth | cut -f1)"
          [[ "$branch_sha" == "$GITHUB_SHA" ]]
          git diff --exit-code
          git diff --cached --exit-code

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dashboard dependencies without lifecycle hooks
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund

      - name: Install CLI dependencies without postinstall
        working-directory: cli
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund

      - name: Install test dependencies
        working-directory: tests
        # npm 10's optional Vitest peer resolution can fail with edgesOut=null.
        run: npm install --ignore-scripts --package-lock=false --legacy-peer-deps --no-audit --no-fund

      - name: Test embedded dashboard security
        working-directory: tests
        run: npm test -- unit/dashboard-guard.test.js unit/dashboard-session.test.js --maxWorkers=1

      - name: Build precompiled CLI package off-server
        working-directory: cli
        run: npm run build

      - name: Pack without lifecycle scripts
        working-directory: cli
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workplace-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/workplace-package"

      - name: Verify archive and write manifest
        env:
          PACKAGE_DIR: ${{ runner.temp }}/workplace-package
        run: |
          python3 <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tarfile

          output = pathlib.Path(os.environ['PACKAGE_DIR'])
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}', commit) and commit == os.environ['GITHUB_SHA']
          root = json.loads(pathlib.Path('package.json').read_text())
          cli = json.loads(pathlib.Path('cli/package.json').read_text())
          version = cli['version']
          assert root['version'] == version
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', version)
          package = output / f'9router-{version}.tgz'
          assert list(output.glob('*.tgz')) == [package]
          markers = {
              'Cross-origin request blocked': False,
              'Embedded sign-in requires HTTPS.': False,
              'Enable embedded sign-in': False,
              'X-9Router-Embedded': False,
          }
          with tarfile.open(package, 'r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              for required in ('package/app/server.js', 'package/app/custom-server.js', 'package/app/.next-cli-build/BUILD_ID', 'package/app/.next-cli-build/server/app/api/auth/login/route.js'):
                  assert required in names, f'Missing prebuilt artifact: {required}'
              assert archive.extractfile('package/app/.next-cli-build/BUILD_ID').read().strip()
              assert json.load(archive.extractfile('package/package.json'))['version'] == version
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not member.issym() and not member.islnk(), f'Unexpected archive link: {member.name}'
                  assert not any(part == '.env' or part.startswith('.env.') or part in ('.build-home', '.9router') for part in path.parts), f'Private runtime file: {member.name}'
                  if member.isfile() and member.name.startswith('package/app/.next-cli-build/') and member.name.endswith('.js'):
                      text = archive.extractfile(member).read().decode('utf-8', errors='replace')
                      for marker in markers:
                          markers[marker] |= marker in text
          assert all(markers.values()), f'Embedded security code missing from compiled package: {markers}'
          manifest = {
              'repository': 'SongUylong/9router',
              'branch': 'fix/iframe-dashboard-auth',
              'commit': commit,
              'version': version,
              'sha256': hashlib.file_digest(package.open('rb'), 'sha256').hexdigest(),
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Verified Workplace package\n```json\n' + json.dumps(manifest, indent=2) + '\n```\n')
          PY

      - name: Upload verified Workplace package
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 9router-workplace-package
          path: |
            ${{ runner.temp }}/workplace-package/9router-*.tgz
            ${{ runner.temp }}/workplace-package/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Record artifact metadata
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          printf 'Artifact ID: %s\nArtifact URL: %s\nArtifact SHA256: %s\n' "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
